name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'
          - php: '8.4'
            laravel: '10.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Laravel ${{ matrix.laravel }} dependencies
        run: >
          composer require --no-interaction --no-update
          illuminate/cache:${{ matrix.laravel }}
          illuminate/config:${{ matrix.laravel }}
          illuminate/console:${{ matrix.laravel }}
          illuminate/database:${{ matrix.laravel }}
          illuminate/support:${{ matrix.laravel }}
          illuminate/view:${{ matrix.laravel }}

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction

      - name: Run tests
        run: composer test

  pint:
    runs-on: ubuntu-latest

    name: Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test